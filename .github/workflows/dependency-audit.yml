name: Dependency Audit

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'schedule' || github.repository == 'openclaw/openclaw'
    # open-group-super-cluster is only on r3-r9. grow-ci is also on the 48
    # open-group-N inference-host runners; CI must not land there.
    runs-on: [self-hosted, Linux, X64, grow-ci, open-group-super-cluster]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        run: |
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node "24.22.1"

      - name: Audit production dependencies
        run: |
          echo 'Triage owner: @steipete. Investigate failures and rerun this strict audit to confirm recovery.' >> "$GITHUB_STEP_SUMMARY"
          node scripts/pre-commit/pnpm-audit-prod.mjs --audit-level=high
